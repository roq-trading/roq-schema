message ReferenceData {
  uint32 stream_id = 1;  // uint16
  string exchange = 2;
  string symbol = 3;
  optional string description = 4;
  optional SecurityType security_type = 5;
  optional int32 external_security_id = 6;
  optional string market_segment = 7;
  optional string cfi_code = 8;
  optional string base_currency = 9;
  optional string quote_currency = 10;
  optional string settlement_currency = 11;
  optional string margin_currency = 12;
  optional string commission_currency = 13;
  optional double tick_size = 14;
  repeated TickSizeStep tick_size_steps = 15;
  optional double multiplier = 16;
  optional double min_notional = 17;
  optional double min_trade_vol = 18;
  optional double max_trade_vol = 19;
  optional double trade_vol_step_size = 20;
  optional OptionType option_type = 21;
  optional string strike_currency = 22;
  optional double strike_price = 23;
  optional string underlying = 24;
  optional string time_zone = 25;
  optional google.protobuf.Timestamp issue_date = 26;
  optional google.protobuf.Timestamp settlement_date = 27;
  optional google.protobuf.Timestamp expiry_datetime = 28;
  optional google.protobuf.Timestamp expiry_datetime_utc = 29;
  optional google.protobuf.Timestamp exchange_time_utc = 30;
  optional uint64 exchange_sequence = 31;
  optional google.protobuf.Timestamp sending_time_utc = 32;
  bool discard = 33;
}
