message StreamStatus {
  uint32 stream_id = 1;  // uint16
  optional string account = 2;
  repeated SupportType supports = 3;
  Transport transport = 4;
  Protocol protocol = 5;
  repeated Encoding encoding = 6;
  optional Priority priority = 7;
  ConnectionStatus connection_status = 8;
  optional string reason = 9;
  optional string interface = 10;
  optional string authority = 11;
  optional string path = 12;
  optional string proxy = 13;
}
