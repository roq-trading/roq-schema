message Event {
  SourceInfo source_info = 1;
  oneof value {
    // client => server
    // - initial
    Handshake handshake = 1000;
    // - service/strategy
    ControlAck control_ack = 2000;
    ServiceUpdate service_update = 2001;
    StrategyUpdate strategy_update = 2002;
    LegsUpdate legs_update = 2003;
    CustomMetrics custom_metrics = 2020;
    CustomMatrix custom_matrix = 2021;
    // - market data
    Subscribe subscribe = 5000;
    // - order management
    CancelAllOrders cancel_all_orders = 6000;
    CreateOrder create_order = 6001;
    ModifyOrder modify_order = 6002;
    CancelOrder cancel_order = 6003;
    // - quote management
    MassQuote mass_quote = 7001;
    CancelQuotes cancel_quotes = 7002;

    // server => client
    // - initial
    HandshakeAck handshake_ack = 1100;
    // - service/strategy
    Control control = 2100;
    CustomMetricsUpdate custom_metrics_update = 2120;
    CustomMatrixUpdate custom_matrix_update = 2121;
    ParametersUpdate parameters_update = 2140;
    // - sync
    DownloadBegin download_begin = 3100;
    DownloadEnd download_end = 3101;
    Ready ready = 3102;
    // - gateway state
    GatewaySettings gateway_settings = 4100;
    GatewayStatus gateway_status = 4101;
    StreamStatus stream_status = 4102;
    ExternalLatency external_latency = 4103;
    RateLimitsUpdate rate_limits_update = 4120;
    RateLimitTrigger rate_limit_trigger = 4140;
    // - market data
    ReferenceData reference_data = 5120;
    MarketStatus market_status = 5121;
    TopOfBook top_of_book = 5140;
    MarketByPriceUpdate market_by_price_update = 5141;
    MarketByOrderUpdate market_by_order_update = 5142;
    TradeSummary trade_summary = 5160;
    StatisticsUpdate statistics_update = 5180;
    TimeSeriesUpdate time_series_update = 5199;
    // - order management
    CancelAllOrdersAck cancel_all_orders_ack = 6100;
    OrderAck order_ack = 6101;
    OrderUpdate order_update = 6102;
    // - quote management
    MassQuoteAck mass_quote_ack = 7101;
    CancelQuotesAck cancel_quotes_ack = 7102;
    // - trades/positions/funds
    TradeUpdate trade_update = 8100;
    PositionUpdate position_update = 8101;
    FundsUpdate funds_update = 8102;
    // - XXX
    Portfolio portfolio = 9100;
    PortfolioUpdate portfolio_update = 9101;
    RiskLimits risk_limits = 9102;
    RiskLimitsUpdate risk_limits_update = 9103;
  }
}
