message Fill {
  optional google.protobuf.Timestamp exchange_time_utc = 1;
  string external_trade_id = 2;
  double quantity = 3;
  double price = 4;
  optional Liquidity liquidity = 5;
  optional double commission_amount = 6;
  optional string commission_currency = 7;
  optional double base_amount = 8;
  optional double quote_amount = 9;
  optional double profit_loss_amount = 10;
}
