message RiskLimit {
  string exchange = 1;
  string symbol = 2;
  optional double long_position = 3;
  optional double short_position = 4;
  optional double long_position_limit = 5;
  optional double short_position_limit = 6;
  optional double long_risk_exposure_limit = 7;
  optional double short_risk_exposure_limit = 8;
  bool allow_netting = 9;
}
