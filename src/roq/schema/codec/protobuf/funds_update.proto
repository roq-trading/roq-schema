message FundsUpdate {
  uint32 stream_id = 1;  // uint16
  string account = 2;
  string currency = 3;
  optional MarginMode margin_mode = 4;
  double balance = 5;
  optional double hold = 6;
  optional double borrowed = 7;
  optional double unrealized_pnl = 8;
  optional string external_account = 9;
  UpdateType update_type = 10;
  optional google.protobuf.Timestamp exchange_time_utc = 11;
  optional uint64 exchange_sequence = 12;
  optional google.protobuf.Timestamp sending_time_utc = 13;
}
