message CancelQuotesAck {
  uint32 stream_id = 1;  // uint16
  string account = 2;
  Origin origin = 3;
  RequestStatus request_status = 4;
  optional Error error = 5;
  optional string text = 6;
  string request_id = 7;
  optional string external_account = 8;
  optional uint32 number_of_affected_quotes = 9;
}
