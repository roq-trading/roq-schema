message HandshakeAck {
  google.protobuf.Timestamp request_time_utc = 1;
  google.protobuf.Timestamp response_time_utc = 2;
  uint64 session_id = 3;
  bool success = 4;
  string failure_reason = 5;
  string package_name = 6;
  string package_version = 7;
  string package_build_number = 8;
  string hostname = 9;
  string username = 10;
  uint64 process_id = 11;
  string service_name = 12;
  string api_name = 13;
  uint32 instance = 14;  // uint8
  bool is_uat = 15;
}
