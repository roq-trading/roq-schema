message HandshakeAck {
  google.protobuf.Timestamp request_time_utc = 1;
  google.protobuf.Timestamp response_time_utc = 2;
  uint64 session_id = 3;
  string package_name = 4;
  string package_version = 5;
  string package_build_number = 6;
  string hostname = 7;
  string username = 8;
  uint64 process_id = 9;
  string service_name = 10;
  string api_name = 11;
  uint32 api = 12;       // uint8
  uint32 instance = 13;  // uint8
  bool is_uat = 14;
}
