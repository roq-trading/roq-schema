message MarketByOrderUpdate {
  uint32 stream_id = 1;  // uint16
  string exchange = 2;
  string symbol = 3;
  repeated MBOUpdate orders = 4;
  UpdateType update_type = 5;
  optional google.protobuf.Timestamp exchange_time_utc = 6;
  optional uint64 exchange_sequence = 7;
  optional google.protobuf.Timestamp sending_time_utc = 8;
  Precision price_precision = 9;
  Precision quantity_precision = 10;
  uint32 max_depth = 11;  // uint16
  optional uint32 checksum = 12;
}
