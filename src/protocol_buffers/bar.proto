message Bar {
  google.protobuf.Timestamp begin_time_utc = 1;
  bool confirmed = 2;
  double open_price = 3;
  double high_price = 4;
  double low_price = 5;
  optional double close_price = 6;
  optional double quantity = 7;
  optional double base_amount = 8;
  optional double quote_amount = 9;
  optional uint32 number_of_trades = 10;
  optional double vwap = 11;
}
