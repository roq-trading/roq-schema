message PositionUpdate {
  uint32 stream_id = 1;  // uint16
  string account = 2;
  string exchange = 3;
  string symbol = 4;
  optional MarginMode margin_mode = 5;
  optional string external_account = 6;
  optional double long_quantity = 7;
  optional double short_quantity = 8;
  UpdateType update_type = 9;
  optional google.protobuf.Timestamp exchange_time_utc = 10;
  optional uint64 exchange_sequence = 11;
  optional google.protobuf.Timestamp sending_time_utc = 12;
}
